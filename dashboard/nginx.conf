server {
  listen 5173;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Application monopage : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Le tableau de bord ne parle qu'au portail. Il n'a aucune route vers le
  # moteur IA ni vers la base : la console de supervision reste un client
  # ordinaire, soumis aux mêmes contrôles de rôle que les autres.
  location /api/ {
    # Résolveur DNS interne de Docker, avec une variable dans `proxy_pass`.
    # Sans cela, nginx résout « passerelle » une seule fois au démarrage et
    # garde l'adresse : redéployer la passerelle lui donne une nouvelle IP et
    # le tableau de bord répond 502 jusqu'au redémarrage de nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $amont http://passerelle:3000;
    proxy_pass $amont;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 180s;
  }
}
